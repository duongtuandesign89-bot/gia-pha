<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Gia phả dòng họ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="thanh-cong-cu">
  <input id="ten-dong-ho" class="ten-ho" type="text" placeholder="Tên dòng họ" aria-label="Tên dòng họ">

  <div class="nhom" id="nhom-vua">
    <button id="vua-man-hinh" title="Xem vừa màn hình">Vừa khung</button>
    <button id="che-do-tieu-diem" aria-pressed="false"
      title="Tiêu điểm: chỉ xem quanh một người (cha mẹ · anh em · con). Bấm để bật/tắt.">Tiêu điểm</button>
  </div>

  <button id="nut-menu" aria-label="Thêm chức năng" aria-expanded="false">⋯</button>

  <!-- Trên máy tính: display:contents nên các nhóm nằm thẳng trên thanh công cụ.
       Trên điện thoại: gói lại thành bảng thả xuống. -->
  <div id="menu">
    <div class="nhom" id="nhom-tim">
      <div class="o-tim-bao">
        <input id="o-tim" type="search" placeholder="Tìm tên…  ( / )" aria-label="Tìm tên">
        <span id="so-khop"></span>
      </div>
      <button id="khop-truoc" title="Kết quả trước (Shift+Enter)">↑</button>
      <button id="khop-sau" title="Kết quả sau (Enter)">↓</button>
    </div>

    <div class="nhom" id="nhom-zoom">
      <button id="thu-nho" title="Thu nhỏ">−</button>
      <span id="muc-phong">100%</span>
      <button id="phong-to" title="Phóng to">+</button>
    </div>

    <div class="nhom" id="nhom-gap">
      <button id="gap-tat-ca" title="Thu gọn mọi nhánh">Gấp hết</button>
      <button id="mo-tat-ca" title="Mở mọi nhánh">Mở hết</button>
    </div>

    <div class="nhom" id="nhom-hoan-tac">
      <button id="hoan-tac" title="Hoàn tác (Ctrl+Z)">↶</button>
      <button id="lam-lai" title="Làm lại (Ctrl+Shift+Z)">↷</button>
    </div>

    <div class="nhom cuoi" id="nhom-tep">
      <button id="nhap" title="Mở tệp gia phả .json">Nhập tệp</button>
      <button id="xuat" class="chinh" title="Lưu dữ liệu ra tệp .json để giữ bản sao">Xuất tệp</button>
      <button id="xuat-sach" title="Xuất sách gia phả PDF nhiều trang: mục lục, mỗi gia đình một trang, bảng tra tên">Sách PDF</button>
      <button id="xuat-anh" title="Xuất ảnh JPEG: cả cây hoặc từng nhánh">Ảnh JPEG</button>
      <button id="xuat-pdf" title="Xuất cả cây trên một trang PDF">PDF 1 trang</button>
      <button id="in" title="In ra giấy">In</button>
      <button id="tao-moi" class="nguy" title="Xoá hết và bắt đầu lại">Tạo mới</button>
      <input id="chon-tep" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<main id="viewport">
  <h1 id="tieu-de-in"></h1>
  <div id="canvas">
    <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="boxes"></div>
  </div>
  <div id="dan-doc" hidden></div>
</main>

<aside id="bang-sua">
  <div class="bang-dau">
    <strong id="bang-sua-doi">Đời</strong>
    <button id="dong-bang-sua" title="Đóng (Esc)">✕</button>
  </div>
  <div id="bang-sua-noi-dung"></div>
</aside>

<footer id="thanh-duoi">
  <span id="trang-thai"></span>
  <span class="meo">Kéo nền để di chuyển · lăn chuột để phóng to · bấm vào ô để sửa · dữ liệu tự lưu trong trình duyệt</span>
</footer>

<div id="dang-lam" hidden><span></span></div>

<dialog id="hop-xuat">
  <form method="dialog" id="form-xuat">
    <h2>Xuất gia phả</h2>

    <fieldset>
      <legend>Kiểu</legend>
      <label><input type="radio" name="kieu" value="sach" checked>
        <span><b>Sách PDF nhiều trang</b><small>Bìa, mục lục, tổng quát đời I–III, mỗi gia đình một trang có “xem tiếp trang”, bảng tra tên A–Z. Dùng để in.</small></span></label>
      <label><input type="radio" name="kieu" value="anh">
        <span><b>Ảnh JPEG</b><small>Vẽ đủ cả nhánh, kể cả phần đang thu gọn. Nét để gửi Zalo và phóng to trên điện thoại.</small></span></label>
      <label><input type="radio" name="kieu" value="pdf1">
        <span><b>PDF một trang</b><small>Cả phạm vi đã chọn trên một trang. Cây lớn thì chữ sẽ rất nhỏ.</small></span></label>
    </fieldset>

    <fieldset>
      <legend>Phạm vi</legend>
      <label><input type="radio" name="pham" value="tatca" checked><span>Toàn bộ dòng họ</span></label>
      <label><input type="radio" name="pham" value="nhanh"><span>Một nhánh:
        <select id="xuat-nhanh"></select></span></label>
      <label id="dong-nguoi-chon"><input type="radio" name="pham" value="chon"><span>Từ người đang chọn trở xuống:
        <em id="xuat-nguoi-chon"></em></span></label>
      <label class="chi-anh"><input type="checkbox" id="xuat-tach" checked>
        <span>Tách mỗi nhánh con một ảnh riêng <small>(toàn bộ dòng họ: mỗi nhánh đời II một ảnh)</small></span></label>
      <label class="chi-pdf1"><input type="checkbox" id="xuat-mo-het" checked><span>Vẽ cả các nhánh đang thu gọn</span></label>
    </fieldset>

    <fieldset class="chi-giay">
      <legend>Khổ giấy</legend>
      <div class="hang">
        <select id="xuat-kho">
          <option value="A3">A3</option>
          <option value="A4">A4</option>
          <option value="cay" class="chi-pdf1">Vừa khít cây (không theo khổ giấy)</option>
        </select>
        <label><input type="radio" name="huong" value="ngang" checked><span>Ngang</span></label>
        <label><input type="radio" name="huong" value="doc"><span>Dọc</span></label>
      </div>
    </fieldset>

    <p id="xuat-goi-y"></p>

    <menu>
      <button value="huy" type="submit">Huỷ</button>
      <button value="ok" type="submit" class="chinh" id="xuat-lam">Xuất</button>
    </menu>
  </form>
</dialog>

<script src="nguoi.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="render.js"></script>
<script src="xuat-anh.js"></script>
<script src="xuat-sach.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
